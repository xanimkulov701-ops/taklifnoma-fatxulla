<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatxulla & Zeboxon — To'y Taklifnomasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0f1016;
            color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #171923;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: #d4af37;
            margin-bottom: 10px;
        }
        .names {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            margin: 20px 0;
            color: #ffffff;
        }
        .date {
            font-size: 16px;
            letter-spacing: 2px;
            color: #ccc;
            margin-bottom: 25px;
        }
        .countdown {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
            background: #212433;
            padding: 15px;
            border-radius: 8px;
        }
        .time-box span {
            display: block;
            font-size: 20px;
            font-weight: 600;
            color: #d4af37;
        }
        .time-box label {
            font-size: 12px;
            color: #aaa;
        }
        .details {
            margin: 25px 0;
            font-size: 14px;
            line-height: 1.6;
            color: #ddd;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #d4af37;
            color: #000;
            text-decoration: none;
            font-weight: 600;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #b5952f;
        }
        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #d4af37;
            color: #000;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- Fon musiqasi: Ed Sheeran - Perfect -->
    <audio id="bg-music" loop>
        <source src="https://ns319208.ip-51-81-13.net/files/e/en/Ed_Sheeran_-_Perfect_(CeeNaija.com).mp3" type="audio/mp3">
    </audio>

    <button class="music-btn" id="music-toggle" onclick="toggleMusic()">🎵</button>

    <div class="container">
        <h1>To'y Taklifnomasi</h1>
        <div class="names">Fatxulla & Zeboxon</div>
        <div class="date">2026-yil 15-sentabr, soat 17:00</div>

        <div class="countdown">
            <div class="time-box"><span id="days">00</span><label>Kun</label></div>
            <div class="time-box"><span id="hours">00</span><label>Soat</label></div>
            <div class="time-box"><span id="minutes">00</span><label>Daqiqa</label></div>
            <div class="time-box"><span id="seconds">00</span><label>Soniya</label></div>
        </div>

        <div class="details">
            <p><b>Manzil:</b> "Tantana" to'yxonasi, Toshkent shahar.</p>
            <p>Sizni aziz oila a'zolarimiz davrasida bo'ladigan to'y oqshomimizda ko'rsak-nasib etamiz!</p>
        </div>

        <a href="https://youtube.com" target="_blank" class="btn">Jonli Efir (Live Stream)</a>
        <a href="https://click.uz" target="_blank" class="btn" style="background: #212433; color: #d4af37; border: 1px solid #d4af37;">Bank Karta / Payme & Click</a>
    </div>

    <script>
        // Taymer hisoblagichi
        const weddingDate = new Date("September 15, 2026 17:00:00").getTime();
        function updateCountdown() {
            const now = new Date().getTime();
            const diff = weddingDate - now;
            if (diff > 0) {
                document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById("seconds").innerText = Math.floor((diff % (1000 * 60)) / 1000);
            }
        }
        setInterval(updateCountdown, 1000);

        // Musiqa tugmasi
        const music = document.getElementById("bg-music");
        const musicBtn = document.getElementById("music-toggle");
        function toggleMusic() {
            if (music.paused) {
                music.play();
                musicBtn.innerText = "⏸";
            } else {
                music.pause();
                musicBtn.innerText = "🎵";
            }
        }
    </script>
</body>
</html>
